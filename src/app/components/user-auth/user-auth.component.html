<div class="container p-4">
    <div class="row">
      <div class="col-12">
        <form 
        autocomplete="off"
          class="border border-1 rounded p-4" 
          [formGroup]="loginForm" 
          (ngSubmit)="onSubmit()"
        >
  
          <!-- Email -->
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input 
              type="email" 
              class="form-control"
              formControlName="email"
            />
  
            <!-- Validation -->
            <div class="text-danger mt-1" *ngIf="email.invalid && (email.dirty || email.touched)">
              <span *ngIf="email.errors?.['required']">Email is required.</span>
              <span *ngIf="email.errors?.['email']">Enter a valid email.</span>
            </div>
          </div>
  
          <!-- Password -->
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input 
              type="password" 
              class="form-control"
              formControlName="password"
            />
  
            <div class="text-danger mt-1" *ngIf="password.invalid && (password.dirty || password.touched)">
              <span *ngIf="password.errors?.['required']">Password is required.</span>
            </div>
          </div>
  
          <button 
            type="submit" 
            class="btn btn-primary"
            [disabled]="loginForm.invalid"
          >
            Submit
          </button>
  
        </form>
      </div>
    </div>
  </div>
  <app-toaster></app-toaster>
