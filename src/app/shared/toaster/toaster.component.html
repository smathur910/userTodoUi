<div class="toast-container position-fixed bottom-0 end-0 p-3">

    <div *ngFor="let t of toastService.toasts; let i = index"
         class="toast"
         id="toast-{{ i }}"
         role="alert"
         aria-live="assertive"
         aria-atomic="true">
  
      <div class="toast-header">
        <strong class="me-auto">{{ t.header }}</strong>
        <button type="button" class="btn-close" (click)="toastService.remove(t)"></button>
      </div>
  
      <div class="toast-body">
        {{ t.text }}
      </div>
  
    </div>
  
  </div>
